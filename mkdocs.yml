site_name: YuXian Collection 
theme:
  favicon: img/favicon.ico
  name: material
  custom_dir: overrides
  language: zh
  features:
    - content.code.annotate
    - content.action.edit
    # - navigation.sections
    - navigation.tracking
    - navigation.top
    - navigation.tabs
    - navigation.footer
    - navigation.indexes
    # - navigation.expand
    - navigation.instant
    - navigation.collapsible
    - search.suggest
    - search.share
  palette: 
    # primary: cyan

    - media: "(prefers-color-scheme: light)"
      scheme: default # 日间模式
      primary: cyan # 上方的
      accent: indigo # 链接等可交互元件的高亮色
      # teal 
      toggle:
        icon: material/toggle-switch # 图标
        name: 切换至夜间模式 # 鼠标悬浮提示
    - media: "(prefers-color-scheme: dark)"
      scheme: slate # 夜间模式
      primary: black 
      accent: indigo
      # teal
      toggle:
        icon: material/toggle-switch-off-outline
        name: 切换至日间模式

